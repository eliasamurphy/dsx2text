name: Deploy
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar.gz

          - os: windows-latest
            name: windows-x86_64
            archive: zip

          - os: macos-latest
            name: macos-arm64
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"

      - name: Build dsx2text
        shell: bash
        run: |
          uv sync
          uv run -m nuitka dsx2text.py --mode=standalone --include-package=libdsx --assume-yes-for-downloads

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NAME="dsx2text_v${{ github.run_number }}_${{ matrix.name }}"
          mv dsx2text.dist "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NAME="dsx2text_v${{ github.run_number }}_${{ matrix.name }}"
          mv dsx2text.dist "$NAME"
          7z a "$NAME.zip" "$NAME"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          NAME="dsx2text_v${{ github.run_number }}_${{ matrix.name }}"
          mv dsx2text.dist "$NAME"
          zip -r "$NAME.zip" "$NAME"

      - name: Generate attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            *.zip
            *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsx2text_v${{ github.run_number }}_${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: v${{ github.run_number }}
          generateReleaseNotes: true
          artifacts: "artifacts/*"
          token: ${{ github.token }}
          makeLatest: true
          skipIfReleaseExists: true